<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Paw Prints Weekly author page"><title>PPW Author | Paw Prints Weekly</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="ppw-v5.css?v=3"><style>main{max-width:1060px;margin:0 auto;padding:70px 20px}.author-head{display:flex;gap:20px;align-items:center;margin-bottom:35px}.avatar{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:#9d1b2e;color:#fff;font:900 2rem Arial}.stories{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.back{display:inline-block;margin-bottom:25px;color:#9d1b2e;font-weight:800;text-decoration:none}@media(max-width:700px){.stories{grid-template-columns:1fr}.author-head{align-items:flex-start}}</style></head><body><main><a class="back" href="./">← Back to PPW</a><div id="authorHead" class="author-head"><div class="avatar">P</div><div><span class="eyebrow">PPW NEWSROOM</span><h1>Author</h1><p>Stories written for Paw Prints Weekly.</p></div></div><div id="stories" class="stories"><div class="loading-card">Loading stories...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const U='https://qyipadinsphoyxotrceo.supabase.co',K='sb_publishable_S73dZK9ro03lWDbHFzZhw_5t5pDtGt',db=supabase.createClient(U,K),q=new URLSearchParams(location.search).get('name')||'PPW Staff',e=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));document.title=`${q} | Paw Prints Weekly`;document.querySelector('.author-head h1').textContent=q;document.querySelector('.avatar').textContent=q.trim()[0]?.toUpperCase()||'P';const {data,error}=await db.from('articles').select('title,slug,excerpt,category,published_at,image_url').eq('status','published').eq('author',q).order('published_at',{ascending:false});const h=document.getElementById('stories');if(error||!data?.length){h.innerHTML='<div class="empty-card">No published stories are listed for this author yet.</div>';return}h.innerHTML=data.map(a=>`<article class="story-card"><a href="article.html?slug=${encodeURIComponent(a.slug)}">${a.image_url?`<img class="story-image" src="${e(a.image_url)}" alt="${e(a.title)}">`:''}<div class="story-body"><span class="category-pill">${e(a.category).toUpperCase()}</span><h2>${e(a.title)}</h2><p>${e(a.excerpt||'')}</p></div></a></article>`).join('')})().catch(()=>{document.getElementById('stories').innerHTML='<div class="empty-card">The author page is temporarily unavailable.</div>'});</script></body></html>
