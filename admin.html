<!DOCTYPE html>
<html lang="en" class="ppw-loader-active">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPW Admin | Paw Prints Weekly</title>
    <style id="ppw-loader-critical">
        html.ppw-loader-active,
        html.ppw-loader-active body {
            overflow: hidden !important;
        }
        .ppw-loader {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 2147483647 !important;
            display: grid !important;
            place-items: center !important;
            background: #f7f4ed !important;
            opacity: 1;
            visibility: visible;
            pointer-events: all !important;
        }
        .ppw-loader.is-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
    </style>
    <link rel="stylesheet" href="admin.css">
</head>
<body class="ppw-loading">

    <!-- PPW OPENING LOADER -->
    <div class="ppw-loader" id="ppwLoader" aria-label="Loading Paw Prints Weekly">
        <div class="ppw-loader-bg-ring ring-one"></div>
        <div class="ppw-loader-bg-ring ring-two"></div>

        <div class="ppw-loader-inner">
            <div class="ppw-loader-paw-trail" aria-hidden="true">
                <div class="ppw-paw paw-one">
                    <i class="toe t1"></i><i class="toe t2"></i><i class="toe t3"></i><i class="toe t4"></i><b class="pad"></b>
                </div>
                <div class="ppw-paw paw-two">
                    <i class="toe t1"></i><i class="toe t2"></i><i class="toe t3"></i><i class="toe t4"></i><b class="pad"></b>
                </div>
                <div class="ppw-paw paw-three">
                    <i class="toe t1"></i><i class="toe t2"></i><i class="toe t3"></i><i class="toe t4"></i><b class="pad"></b>
                </div>
            </div>

            <div class="ppw-loader-logo-wrap">
                <div class="ppw-loader-logo-ring"></div>
                <img src="images/tiger.png" alt="" class="ppw-loader-logo">
            </div>

            <div class="ppw-loader-title">
                <strong>PAW PRINTS</strong>
                <span>WEEKLY</span>
            </div>

            <div class="ppw-loader-rule" aria-hidden="true">
                <span></span>
            </div>

            <p class="ppw-loader-school">GLEN A. WILSON HIGH SCHOOL</p>
        </div>
    </div>

    <script>
    (function(){
        const loader = document.getElementById("ppwLoader");
        if (!loader) return;

        const finishLoader = () => {
            loader.classList.add("is-hidden");
            document.body.classList.remove("ppw-loading");
            document.documentElement.classList.remove("ppw-loader-active");
            window.setTimeout(() => {
                if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 800);
        };

        // Fixed timeline: the animation never waits for Supabase or any
        // other resource, so the admin login can never be trapped behind it.
        window.setTimeout(finishLoader, 3600);
    })();
    </script>

    <div id="loginView" class="auth-screen">
        <div class="auth-card">
            <div class="auth-mark">PPW</div>
            <p class="eyebrow">PAW PRINTS WEEKLY</p>
            <h1>Staff Login</h1>
            <p class="muted">Sign in to manage newspaper articles.</p>
            <a href="index.html" class="back-to-ppw">← Back to PPW Website</a>
            <form id="loginForm">
                <label>Email
                    <input id="loginEmail" type="email" autocomplete="email" required>
                </label>
                <label>Password
                    <input id="loginPassword" type="password" autocomplete="current-password" required>
                </label>
                <button class="primary-btn" type="submit">Sign In</button>
                <p id="loginMessage" class="message"></p>
            </form>
        </div>
    </div>

    <div id="adminView" class="admin-shell hidden">
        <header class="admin-header">
            <div>
                <p class="eyebrow">PAW PRINTS WEEKLY</p>
                <h1>Newsroom</h1>
            </div>
            <div class="header-actions">
                <a href="index.html" class="secondary-btn">← Back to PPW</a>
                <button id="logoutBtn" class="secondary-btn">Log Out</button>
            </div>
        </header>

        <main class="admin-main">
            <section class="editor-panel">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">PUBLISHING</p>
                        <h2 id="editorHeading">Create Article</h2>
                    </div>
                    <button id="cancelEditBtn" class="text-btn hidden" type="button">Cancel Edit</button>
                </div>

                <form id="articleForm">
                    <input id="articleId" type="hidden">

                    <div class="form-grid">
                        <label class="full">Headline
                            <input id="title" type="text" maxlength="180" placeholder="Enter the article headline" required>
                        </label>

                        <label>Category
                            <select id="category" required>
                                <option>School News</option>
                                <option>Student Life</option>
                                <option>Sports</option>
                                <option>Opinions</option>
                                <option>Events</option>
                                <option>Features</option>
                            </select>
                        </label>

                        <label>Author
                            <input id="author" type="text" maxlength="100" value="PPW Staff" required>
                        </label>

                        <label class="full">Short Description
                            <textarea id="excerpt" rows="3" maxlength="300" placeholder="A short summary shown on article cards..."></textarea>
                        </label>

                        <label class="full">Article
                            <textarea id="content" rows="16" placeholder="Write the full story here..." required></textarea>
                        </label>

                        <label>Publication Date
                            <input id="publishedAt" type="datetime-local">
                        </label>

                        <label>Article Photo
                            <input id="imageFile" type="file" accept="image/*">
                            <span class="help">JPG, PNG, WEBP, or GIF.</span>
                        </label>
                    </div>

                    <div id="currentImageWrap" class="current-image hidden">
                        <span>Current image</span>
                        <img id="currentImage" alt="Current article image">
                    </div>

                    <div class="options">
                        <label class="checkbox">
                            <input id="featured" type="checkbox">
                            <span>Featured article</span>
                        </label>
                        <label class="checkbox">
                            <input id="publishNow" type="checkbox" checked>
                            <span>Published</span>
                        </label>
                    </div>

                    <div class="form-actions">
                        <button id="saveDraftBtn" class="secondary-btn" type="button">Save Draft</button>
                        <button class="primary-btn" type="submit">Publish Article</button>
                    </div>

                    <p id="articleMessage" class="message"></p>
                </form>
            </section>

            <section class="articles-panel">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">CONTENT</p>
                        <h2>Your Articles</h2>
                    </div>
                    <button id="refreshBtn" class="secondary-btn" type="button">Refresh</button>
                </div>
                <div id="articleList" class="article-list">
                    <div class="empty-state">Loading articles...</div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
</body>
</html>
